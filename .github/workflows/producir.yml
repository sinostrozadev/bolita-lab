# Producción de Shorts en la nube (docs/OPERACION.md § "Producción en la nube").
# Renderiza guiones del backlog (voz, sonido, simulación, mp4), deja el estado commiteado
# (salida/bandeja/<id>.json, backlog/guiones movidos, hoja de contacto, PARA-SUBIR-A-MANO.md) y
# publica los mp4 como artifact "shorts-<fecha>" (14 días). La subida a YouTube está APAGADA salvo
# que se pida con el input `subir` o la variable de repo BOLITA_SUBIR = 1.
name: Producir Shorts

on:
  push:
    branches: [master]
    # Solo lo que produce un humano (guiones nuevos o cambios de calendario). NUNCA salida/:
    # así el commit del bot no podría disparar este workflow aunque se pusheara con otro token.
    paths:
      - 'contenido/backlog/**'
      - 'contenido/calendario.json'
  workflow_dispatch:
    inputs:
      cuantos:
        description: 'Cuántos Shorts renderizar (con guion explícito siempre es 1)'
        default: '2'
        type: string
      guion:
        description: 'Opcional: ruta de un guion del repo (ej. contenido/prototipos/ritmo-canon.json) o texto contenido en el nombre de uno del backlog. Solo se renderiza ese'
        default: ''
        type: string
      commit:
        description: 'Commitear el estado (guion movido, json de bandeja, hoja) como bot. A mano por defecto NO: solo artifact. Schedule/push siempre commitean'
        default: false
        type: boolean
      concurrencia:
        description: 'Pestañas de Remotion (vacío = automático según vCPU/RAM)'
        default: ''
        type: string
      subir:
        description: 'Subir a YouTube (queda privado mientras Google no audite el proyecto)'
        default: false
        type: boolean
  schedule:
    - cron: '30 6 * * *' # 06:30 UTC = 03:30 en Chile (respaldo diario)

permissions:
  contents: write

concurrency:
  group: producir
  cancel-in-progress: false

jobs:
  producir:
    # A mano siempre; automático (schedule/push) solo con la variable de repo BOLITA_NUBE_AUTO=1 (mientras corra el cron local,
    # ambos tomarían el mismo guion). Contra bucles: un push cuyo último commit es del bot (`bot: …`) no produce.
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (vars.BOLITA_NUBE_AUTO == '1' &&
       (github.event_name != 'push' || !startsWith(github.event.head_commit.message, 'bot:')))
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      BOLITA_NUBE: '1'
      BOLITA_MEMORIA_MIN_MB: '1500'
      BOLITA_RENDER_MAX_MIN: '40'
      CUANTOS: ${{ inputs.cuantos || '2' }}
      GUION: ${{ inputs.guion || '' }}
    steps:
      - uses: actions/checkout@v4
        with:
          # siempre el último estado de master (aunque lo dispare un push anterior); a mano se puede lanzar con --ref <rama> para probar
          ref: ${{ github.event_name == 'workflow_dispatch' && github.ref_name || 'master' }}

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Máquina, fecha (Chile) y nombre del artifact
        id: fecha
        run: |
          fecha=$(TZ=America/Santiago date +%F)
          echo "fecha=$fecha" >> "$GITHUB_OUTPUT"
          cpus=$(nproc); mem=$(awk '/MemTotal/ {print int($2/1024)}' /proc/meminfo)
          # Runner público: 4 vCPU / 16 GB (privado: 2 / 7).
          if [ "$cpus" -ge 4 ] && [ "$mem" -ge 12000 ]; then conc=3; else conc=2; fi
          [ -n "${{ inputs.concurrencia }}" ] && conc="${{ inputs.concurrencia }}"
          echo "BOLITA_CONCURRENCIA=$conc" >> "$GITHUB_ENV"
          echo "CPU $cpus · RAM ${mem} MB · concurrency $conc"
          echo "BOLITA_ARTEFACTO=\`shorts-$fecha-${GITHUB_RUN_ID}\` del run ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}" >> "$GITHUB_ENV"

      - name: Fuentes del sistema (emoji a color para carrera)
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends fonts-noto-color-emoji > /dev/null
          fc-list | grep -qi "Noto Color Emoji" && echo "✓ Noto Color Emoji"

      - name: Dependencias
        run: npm ci --no-audit --no-fund

      # Chrome headless de Remotion (~100 MB): se baja una vez por versión de Remotion (package-lock).
      - name: Caché del Chrome de Remotion
        uses: actions/cache@v4
        with:
          path: node_modules/.remotion
          key: chrome-remotion-${{ runner.os }}-${{ hashFiles('package-lock.json') }}

      - name: Chrome headless de Remotion
        run: npx remotion browser ensure

      - name: Poner el guion elegido en el backlog (solo en el runner, no se commitea salvo commit=true)
        if: env.GUION != ''
        run: |
          mkdir -p contenido/backlog
          if [ -f "$GUION" ]; then origen="$GUION"
          else origen=$(ls contenido/backlog/*"$GUION"*.json 2>/dev/null | head -1 || true); fi
          [ -n "$origen" ] && [ -f "$origen" ] || { echo "::error::No encuentro el guion '$GUION'"; exit 1; }
          case "$origen" in contenido/backlog/*) ;; *) cp "$origen" contenido/backlog/ ;; esac
          for f in contenido/backlog/*.json; do [ "$f" = "contenido/backlog/$(basename "$origen")" ] || rm -f "$f"; done
          echo "CUANTOS=1" >> "$GITHUB_ENV"
          echo "BOLITA_PLANTILLAS_MANUALES=1" >> "$GITHUB_ENV" # admite también ritmo y maquina (Three.js, --gl=swangle)
          echo "Guion: $origen"

      - name: ¿Se sube a YouTube?
        id: subida
        run: |
          if [ "${{ inputs.subir }}" = "true" ] || [ "${{ vars.BOLITA_SUBIR }}" = "1" ]; then
            echo "subir=1" >> "$GITHUB_OUTPUT"; echo "Subida ENCENDIDA"
          else
            echo "subir=0" >> "$GITHUB_OUTPUT"; echo "Subida apagada (input subir=false y BOLITA_SUBIR≠1): solo PARA-SUBIR-A-MANO.md"
          fi

      - name: Credenciales de YouTube
        if: steps.subida.outputs.subir == '1'
        env:
          CLIENTE: ${{ secrets.YOUTUBE_CLIENT_JSON }}
          TOKEN: ${{ secrets.YOUTUBE_TOKEN_JSON }}
        run: |
          if [ -z "$CLIENTE" ] || [ -z "$TOKEN" ]; then
            echo "::error::Faltan los secrets YOUTUBE_CLIENT_JSON y/o YOUTUBE_TOKEN_JSON (ver docs/SANTIAGO.md, 'Producción en la nube')."
            exit 1
          fi
          umask 077
          mkdir -p secrets
          printf '%s' "$CLIENTE" > secrets/youtube-client.json
          printf '%s' "$TOKEN" > secrets/youtube-token.json
          node -e 'for (const f of ["secrets/youtube-client.json","secrets/youtube-token.json"]) JSON.parse(require("fs").readFileSync(f,"utf8"))' \
            || { echo "::error::Algún secret de YouTube no es JSON válido."; exit 1; }
          echo "✓ credenciales escritas en secrets/ (no se commitean: .gitignore)"

      - name: Producir (render + estado)
        id: diario
        run: |
          banderas="--sin-guiones --cuantos $CUANTOS"
          [ "${{ steps.subida.outputs.subir }}" = "1" ] || banderas="$banderas --sin-subir"
          inicio=$(date +%s)
          set +e
          npx tsx scripts/diario.mts $banderas
          codigo=$?
          set -e
          echo "⏱ diario: $(( ($(date +%s) - inicio) / 60 )) min"
          exit $codigo

      - name: Hojas de contacto
        if: always() && steps.diario.outcome != 'skipped'
        run: npx tsx scripts/hojas.mts

      - name: Reunir el resultado
        if: always() && steps.diario.outcome != 'skipped'
        run: |
          mkdir -p resultado
          # mp4 + json de bandeja + hoja de contacto + guion promovido (la bandeja versionada no trae mp4).
          for mp4 in salida/bandeja/*.mp4; do
            [ -f "$mp4" ] || continue
            id=$(basename "$mp4" .mp4)
            cp "$mp4" resultado/
            for x in "salida/bandeja/$id.json" "salida/revisiones/hojas/$id.jpg" "contenido/guiones/$id.json"; do [ -f "$x" ] && cp "$x" resultado/ || true; done
          done
          ls -la resultado
          if [ -n "$GUION" ] && ! ls resultado/*.mp4 >/dev/null 2>&1; then echo "::error::El guion '$GUION' no produjo ningún mp4 (ver el log de 'Producir')"; exit 1; fi

      - name: Publicar resultado como artifact
        if: always() && steps.diario.outcome != 'skipped'
        uses: actions/upload-artifact@v4
        with:
          name: shorts-${{ steps.fecha.outputs.fecha }}-${{ github.run_id }}
          path: resultado/
          retention-days: 14
          compression-level: 0 # el mp4 ya viene comprimido
          if-no-files-found: warn

      - name: Borrar credenciales
        if: always()
        run: rm -rf secrets

      - name: Commit del estado
        if: always() && steps.diario.outcome != 'skipped' && (github.event_name != 'workflow_dispatch' || inputs.commit)
        run: |
          .github/scripts/commit-bot.sh "bot: producción ${{ steps.fecha.outputs.fecha }}" \
            contenido/backlog contenido/guiones salida/bandeja salida/revisiones/hojas

